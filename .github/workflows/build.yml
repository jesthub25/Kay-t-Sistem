name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Java 8 bytecode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven package
        run: |
          set -o pipefail
          mvn -B -ntp package 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: grep -E "\[ERROR\]|\[WARNING\].*\.java" build.log | head -60 | sed 's/^/::error::/' || true
      - name: Verify JAR
        run: python3 scripts/verify_jar.py target/KayitPlugin-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: KayitPlugin
          path: target/KayitPlugin-*.jar
          if-no-files-found: error

  e2e:
    name: E2E Paper ${{ matrix.mc }} (Java ${{ matrix.java }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.16.5', java: '11', experimental: false }
          - { mc: '1.17.1', java: '17', experimental: false }
          - { mc: '1.18.2', java: '17', experimental: false }
          - { mc: '1.19.4', java: '17', experimental: false }
          - { mc: '1.20.4', java: '17', experimental: false }
          - { mc: '1.20.6', java: '21', experimental: false }
          - { mc: '1.21.1', java: '21', experimental: false }
          - { mc: '1.21.4', java: '21', experimental: false }
          - { mc: '1.21.8', java: '21', experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: KayitPlugin
          path: dist
      - name: Install test bot
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Run end-to-end test
        run: bash scripts/smoke_test.sh "${{ matrix.mc }}" "$(ls dist/KayitPlugin-*.jar)"
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.mc }}
          path: server-${{ matrix.mc }}/e2e-console.log
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KayitPlugin
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KayitPlugin-*.jar --clobber
          else
            gh release create "$TAG" dist/KayitPlugin-*.jar --title "KayitPlugin $TAG" --notes-file RELEASE_NOTES.md --latest
          fi
