name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Java 8 bytecode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven package
        run: |
          set -o pipefail
          mvn -B -ntp package 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: grep -E "\[ERROR\]|\[WARNING\].*\.java" build.log | head -60 | sed 's/^/::error::/' || true
      - name: Verify JAR
        run: python3 scripts/verify_jar.py target/KayitPlugin-*.jar
      - uses: actions/upload-artifact@v5
        with:
          name: KayitPlugin
          path: target/KayitPlugin-*.jar
          if-no-files-found: error

  e2e:
    name: E2E Paper ${{ matrix.mc }} (Java ${{ matrix.java }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.16.5', java: '11', experimental: false }
          - { mc: '1.17.1', java: '17', experimental: false }
          - { mc: '1.18.2', java: '17', experimental: false }
          - { mc: '1.19.4', java: '17', experimental: false }
          - { mc: '1.20.4', java: '17', experimental: false }
          - { mc: '1.20.6', java: '21', experimental: false }
          - { mc: '1.21.1', java: '21', experimental: false }
          - { mc: '1.21.4', java: '21', experimental: false }
          - { mc: '1.21.8', java: '21', experimental: false }
          - { mc: '1.21.11', java: '21', experimental: true }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v5
        with:
          name: KayitPlugin
          path: dist
      - name: Install test tools
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          pip install --quiet aiosmtpd
      - name: Run end-to-end test
        run: bash scripts/smoke_test.sh "${{ matrix.mc }}" "$(ls dist/KayitPlugin-*.jar)"
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: server-log-${{ matrix.mc }}
          path: server-${{ matrix.mc }}/e2e-console.log
          if-no-files-found: ignore

  e2e-banplugins:
    name: E2E ${{ matrix.plugin }} (Paper ${{ matrix.mc }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin: AdvancedBan, repo: DevLeoko/AdvancedBan, asset: '^AdvancedBan.*[.]jar$', mc: '1.20.4', java: '17', ban: 'ban', unban: 'unban', provider: 'AdvancedBan' }
          - { plugin: EssentialsX, repo: EssentialsX/Essentials, asset: '^EssentialsX-[0-9].*[.]jar$', mc: '1.21.4', java: '21', ban: 'ban', unban: 'unban', provider: 'Essentials/Vanilla' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v5
        with:
          name: KayitPlugin
          path: dist
      - name: Download ${{ matrix.plugin }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p extra
          URL=$(gh api "repos/${{ matrix.repo }}/releases/latest" --jq '[.assets[] | select(.name | test("${{ matrix.asset }}"))][0].browser_download_url')
          echo "Downloading $URL"
          curl -fsSL -o "extra/${{ matrix.plugin }}.jar" "$URL"
      - name: Install test tools
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          pip install --quiet aiosmtpd
      - name: Run end-to-end test with ${{ matrix.plugin }}
        env:
          EXTRA_JARS: extra/${{ matrix.plugin }}.jar
          BAN_CMD: ${{ matrix.ban }}
          UNBAN_CMD: ${{ matrix.unban }}
          EXPECT_PROVIDER: ${{ matrix.provider }}
        run: |
          export EXTRA_JARS="$(pwd)/$EXTRA_JARS"
          bash scripts/smoke_test.sh "${{ matrix.mc }}" "$(ls dist/KayitPlugin-*.jar)"

  release:
    name: GitHub Release
    needs: [build, e2e, e2e-banplugins]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: KayitPlugin
          path: dist
      - name: Publish release (version from pom.xml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
          TAG="v${VERSION}"
          echo "Version: $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release upload "$TAG" dist/KayitPlugin-*.jar --clobber
            else
              echo "::notice::Release $TAG already exists - bump the version in pom.xml to publish a new one."
            fi
          else
            gh release create "$TAG" dist/KayitPlugin-*.jar --target "$GITHUB_SHA" \
              --title "KayitPlugin $TAG" --notes-file RELEASE_NOTES.md --latest
            echo "::notice::Published $TAG"
          fi
